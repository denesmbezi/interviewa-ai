<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open roles | Interviewa AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-[#f7f4ee] text-slate-900">
    <header class="border-b border-slate-900/10 bg-white/70">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
        <a href="/" class="text-lg font-black tracking-tight">Interviewa AI</a>
        <a href="/" class="rounded-full border border-slate-900/20 px-5 py-2 text-sm font-bold">Company login</a>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-6 py-14">
      <p class="text-xs font-black uppercase tracking-[0.2em] text-[#c84b29]">Open opportunities</p>
      <h1 class="mt-3 text-5xl font-black tracking-tight">Find your next conversation.</h1>
      <p class="mt-4 max-w-2xl text-lg leading-8 text-slate-600">Explore roles, apply with a candidate account, and receive an interview link automatically when your application meets the role criteria.</p>
      <div id="jobs" class="mt-12 grid gap-5 md:grid-cols-2"></div>
    </main>
    <script>
      const jobsEl = document.getElementById('jobs');
      async function loadJobs() {
        const response = await fetch('/api/jobs');
        const jobs = await response.json();
        if (!jobs.length) {
          jobsEl.innerHTML = '<p class="rounded-2xl border border-slate-200 bg-white p-6 text-slate-600">No roles are published yet.</p>';
          return;
        }
        jobsEl.innerHTML = jobs.map((job) => `
          <article class="rounded-2xl border border-slate-900/10 bg-white p-6 shadow-sm">
            <p class="text-sm font-bold text-[#c84b29]">${job.company}</p>
            <h2 class="mt-2 text-2xl font-black">${job.title}</h2>
            <p class="mt-4 line-clamp-4 leading-7 text-slate-600">${job.description}</p>
            <div class="mt-5 flex flex-wrap gap-2">${(job.criteria || []).slice(0, 5).map((item) => `<span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">${item}</span>`).join('')}</div>
            <button data-job="${job.id}" class="apply mt-6 rounded-full bg-[#e4572e] px-5 py-3 text-sm font-bold text-white">Apply for this role →</button>
          </article>
        `).join('');
        document.querySelectorAll('.apply').forEach((button) => button.addEventListener('click', () => { window.location.href = `/?auth=login&apply=${button.dataset.job}`; }));
      }
      loadJobs();
    </script>
  </body>
</html>
